# Fix 8: pgBackRest configuration file
# This file configures pgBackRest for automated PostgreSQL backups

[global]
# Repository path where backups are stored
repo1-path=/backups
repo1-retention-full=30
repo1-retention-diff=7

# Log configuration
log-level-console=info
log-level-file=warn

# Process max for parallel operations
process-max=2

# Compress backups
repo1-compress-type=gz
repo1-compress-level=6

# Checksum algorithm
repo1-checksum-type=sha256

[db1]
# Database 1: auth_db
pg1-host=postgres-auth
pg1-port=5432
pg1-user=postgres
pg1-database=auth_db
pg1-path=/var/lib/postgresql/data

[db2]
# Database 2: user_db
pg2-host=postgres-user
pg2-port=5432
pg2-user=postgres
pg2-database=user_db
pg2-path=/var/lib/postgresql/data

[db3]
# Database 3: system_db
pg3-host=postgres-system
pg3-port=5432
pg3-user=postgres
pg3-database=system_db
pg3-path=/var/lib/postgresql/data

[db4]
# Database 4: clinic_db
pg4-host=postgres-clinic
pg4-port=5432
pg4-user=postgres
pg4-database=clinic_db
pg4-path=/var/lib/postgresql/data
