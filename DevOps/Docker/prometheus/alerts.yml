groups:
  - name: medicare.availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: |
          up{job=~"api-gateway|auth-service|user-service|system-manager-service|clinic-service|appointment-service|scheduling-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: >
            {{ $labels.job }} has been unreachable for 1 minute.
            Check container health and /health/ready.

  - name: medicare.gateway
    interval: 30s
    rules:
      - alert: GatewayHigh5xxRate
        expr: |
          (
            sum(rate(medicare_http_responses_total{service="api-gateway",status_class="5xx"}[5m]))
            /
            sum(rate(medicare_http_responses_total{service="api-gateway"}[5m]))
          ) > 0.05
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API Gateway 5xx rate above 5%"
          description: >
            Gateway 5xx error rate is {{ $value | humanizePercentage }}.
            Check upstream service health and circuit breaker logs.

  - name: medicare.resources
    interval: 30s
    rules:
      - alert: ServiceHighMemory
        expr: |
          process_resident_memory_bytes{job=~"api-gateway|auth-service|user-service|appointment-service"} > 536870912
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: >
            {{ $labels.job }} resident memory exceeds 512 MiB ({{ $value | humanize1024 }}).
            Investigate memory leaks or increase container limits.
