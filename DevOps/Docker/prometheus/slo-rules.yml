# ============================================================
# MediCare SLO Recording Rules — Phase 14
#
# SLOs defined:
#   Availability:    99.9%  (43.8 min/month downtime budget)
#   Login p95:       < 500ms
#   Registration p95: < 1000ms
#   Refresh error rate: < 0.5%
#   Kafka consumer lag: < 1000
#   DB pool usage:   < 80%
#
# Recording rules pre-compute expensive queries so dashboards
# and alerts don't recalculate them on every scrape.
# ============================================================

groups:
  # ── Availability SLI ────────────────────────────────────────────────────────
  - name: slo.availability
    interval: 30s
    rules:
      # 5-minute availability window per service
      - record: slo:service_availability:rate5m
        expr: |
          1 - (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          )
        labels:
          slo: availability

      # 1-hour availability (for burn rate calculation)
      - record: slo:service_availability:rate1h
        expr: |
          1 - (
            rate(http_requests_total{status=~"5.."}[1h])
            /
            rate(http_requests_total[1h])
          )
        labels:
          slo: availability

      # 6-hour availability (medium-term burn rate)
      - record: slo:service_availability:rate6h
        expr: |
          1 - (
            rate(http_requests_total{status=~"5.."}[6h])
            /
            rate(http_requests_total[6h])
          )
        labels:
          slo: availability

      # Error budget remaining (99.9% SLO = 0.1% error budget)
      # 1.0 = full budget, 0.0 = budget exhausted
      - record: slo:error_budget_remaining:rate1h
        expr: |
          (slo:service_availability:rate1h - 0.999) / 0.001
        labels:
          slo: availability

  # ── Latency SLI ─────────────────────────────────────────────────────────────
  - name: slo.latency
    interval: 30s
    rules:
      # Login p95 latency
      - record: slo:login_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_ms_bucket{job="auth-service", path="/auth/login"}[5m])
          )
        labels:
          slo: login_latency
          endpoint: login

      # Registration p95 latency
      - record: slo:register_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_ms_bucket{job="auth-service", path="/auth/register"}[5m])
          )
        labels:
          slo: register_latency
          endpoint: register

      # Refresh token p95 latency
      - record: slo:refresh_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_ms_bucket{job="auth-service", path="/auth/refresh-token"}[5m])
          )
        labels:
          slo: refresh_latency
          endpoint: refresh

      # Gateway overall p95
      - record: slo:gateway_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_ms_bucket{job="api-gateway"}[5m])
          )
        labels:
          slo: gateway_latency

  # ── Error Rate SLI ───────────────────────────────────────────────────────────
  - name: slo.error_rate
    interval: 30s
    rules:
      # Refresh token error rate (target: < 0.5%)
      - record: slo:refresh_error_rate:rate5m
        expr: |
          rate(http_requests_total{job="auth-service", path="/auth/refresh-token", status=~"5.."}[5m])
          /
          rate(http_requests_total{job="auth-service", path="/auth/refresh-token"}[5m])
        labels:
          slo: refresh_error_rate

      # Login error rate (4xx = user errors, 5xx = system errors)
      - record: slo:login_system_error_rate:rate5m
        expr: |
          rate(http_requests_total{job="auth-service", path="/auth/login", status=~"5.."}[5m])
          /
          rate(http_requests_total{job="auth-service", path="/auth/login"}[5m])
        labels:
          slo: login_system_error_rate

  # ── Kafka SLI ────────────────────────────────────────────────────────────────
  - name: slo.kafka
    interval: 30s
    rules:
      # Max consumer lag across all partitions per group
      - record: slo:kafka_max_consumer_lag
        expr: |
          max by (consumergroup) (kafka_consumer_group_lag)
        labels:
          slo: kafka_consumer_lag

      # Outbox pending events (from user-service DB — scraped via custom metric)
      # Requires user-service to expose outbox_pending_count gauge
      - record: slo:outbox_pending_events
        expr: |
          outbox_pending_events_total{job="user-service"}
        labels:
          slo: outbox_health

  # ── Database SLI ─────────────────────────────────────────────────────────────
  - name: slo.database
    interval: 30s
    rules:
      # DB pool utilisation per database
      - record: slo:db_pool_utilisation
        expr: |
          pg_stat_activity_count{state="active"}
          /
          pg_settings_max_connections
        labels:
          slo: db_pool

      # DB query latency p95 (requires pg_stat_statements exporter)
      - record: slo:db_query_latency_p95
        expr: |
          histogram_quantile(0.95,
            rate(pg_stat_statements_total_time_seconds_bucket[5m])
          )
        labels:
          slo: db_latency

# ── SLO Burn Rate Alerts ─────────────────────────────────────────────────────
# Burn rate = how fast you're consuming your error budget
# 1x burn rate = consuming budget at exactly the SLO rate (sustainable)
# 14.4x burn rate = will exhaust monthly budget in 2 hours (page immediately)
# 6x burn rate = will exhaust monthly budget in 5 hours (page soon)
groups:
  - name: slo.burn_rate_alerts
    rules:
      # Fast burn: 14.4x over 1h AND 6x over 5m → page immediately
      - alert: SLOBurnRateFast
        expr: |
          (
            slo:service_availability:rate1h < (1 - 14.4 * 0.001)
          ) and (
            slo:service_availability:rate5m < (1 - 6 * 0.001)
          )
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "SLO fast burn rate — error budget exhausting rapidly"
          description: >
            Service {{ $labels.job }} is burning error budget at 14.4x rate.
            At this rate the monthly budget will be exhausted in ~2 hours.
            Immediate action required.

      # Slow burn: 6x over 6h AND 3x over 30m → ticket + Slack
      - alert: SLOBurnRateSlow
        expr: |
          (
            slo:service_availability:rate6h < (1 - 6 * 0.001)
          ) and (
            slo:service_availability:rate1h < (1 - 3 * 0.001)
          )
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SLO slow burn rate — error budget draining"
          description: >
            Service {{ $labels.job }} is burning error budget at 6x rate over 6h.
            At this rate the monthly budget will be exhausted in ~5 hours.
            Investigate and resolve before it becomes critical.

      # Login latency SLO breach (p95 > 500ms)
      - alert: LoginLatencySLOBreach
        expr: slo:login_latency_p95:rate5m > 500
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Login p95 latency above SLO target of 500ms"
          description: >
            Login p95 latency is {{ $value | humanizeDuration }}ms.
            SLO target is 500ms. Check DB connection pool and Kafka consumer lag.

      # Registration latency SLO breach (p95 > 1000ms)
      - alert: RegistrationLatencySLOBreach
        expr: slo:register_latency_p95:rate5m > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Registration p95 latency above SLO target of 1000ms"
          description: >
            Registration p95 latency is {{ $value | humanizeDuration }}ms.
            SLO target is 1000ms.

      # Refresh error rate SLO breach (> 0.5%)
      - alert: RefreshErrorRateSLOBreach
        expr: slo:refresh_error_rate:rate5m > 0.005
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Refresh token error rate above SLO target of 0.5%"
          description: >
            Refresh token error rate is {{ $value | humanizePercentage }}.
            SLO target is 0.5%. Check session service and DB connectivity.

      # Kafka consumer lag SLO breach (> 1000)
      - alert: KafkaLagSLOBreach
        expr: slo:kafka_max_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag above SLO target of 1000"
          description: >
            Consumer group {{ $labels.consumergroup }} lag is {{ $value }}.
            SLO target is 1000. Check consumer service health.

      # DB pool SLO breach (> 80%)
      - alert: DBPoolSLOBreach
        expr: slo:db_pool_utilisation > 0.8
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "DB pool utilisation above SLO target of 80%"
          description: >
            Database {{ $labels.datname }} pool is at {{ $value | humanizePercentage }}.
            SLO target is 80%. New requests will queue above this threshold.
