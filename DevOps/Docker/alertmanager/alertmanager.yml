global:
  # How long to wait before sending a notification about new alerts
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:587'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# ── Templates ────────────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── Routing tree ─────────────────────────────────────────────────────────────
# group_by: alerts with the same alertname + severity are batched together
# group_wait: wait 30s before sending the first notification (collects related alerts)
# group_interval: wait 5m before sending a notification about new alerts in the group
# repeat_interval: resend if alert is still firing after 4h
route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-warnings'

  routes:
    # Critical alerts → PagerDuty + Slack + email
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true   # also send to next matching route

    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true

    - match:
        severity: critical
      receiver: 'email-oncall'

    # Security alerts → dedicated security channel
    - match:
        team: security
      receiver: 'slack-security'

    # Warning alerts → general Slack channel
    - match:
        severity: warning
      receiver: 'slack-warnings'

# ── Inhibition rules ─────────────────────────────────────────────────────────
# Suppress downstream alerts when the root cause is already firing.
# Example: if a Postgres instance is down, suppress pool exhaustion alerts
# for that same database — the pool alert is a symptom, not the cause.
inhibit_rules:
  - source_match:
      alertname: 'PostgresDown'
    target_match:
      alertname: 'DatabasePoolExhaustion'
    equal: ['job']

  - source_match:
      alertname: 'KafkaBrokerDown'
    target_match:
      alertname: 'KafkaConsumerLag'

  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'SlowLoginLatency'

# ── Receivers ────────────────────────────────────────────────────────────────
receivers:
  - name: 'slack-warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#medicare-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.job }}
          {{ end }}

  - name: 'slack-critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#medicare-critical'
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.job }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}

  - name: 'slack-security'
    slack_configs:
      - api_url: '${SLACK_SECURITY_WEBHOOK_URL}'
        channel: '#medicare-security'
        send_resolved: true
        title: '🔐 [SECURITY] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: 'email-oncall'
    email_configs:
      - to: '${ONCALL_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[MediCare CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.job }}
          Runbook: {{ .Annotations.runbook }}
          {{ end }}

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'
        severity: 'critical'
        details:
          description: '{{ (index .Alerts 0).Annotations.description }}'
          runbook: '{{ (index .Alerts 0).Annotations.runbook }}'
