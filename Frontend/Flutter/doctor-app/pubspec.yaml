name: cms_doctor_app
description: MediCare Doctor Flutter app
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  dio: ^5.7.0
  shared_preferences: ^2.3.3
