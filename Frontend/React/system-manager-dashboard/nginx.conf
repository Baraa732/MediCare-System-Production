server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow multipart activation provisioning (JSON + document uploads).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Docker embedded DNS — re-resolve upstreams so api-gateway IP changes
    # after container recreate do not leave nginx proxying a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api-gateway:3000;
        # With a variable upstream, omit the URI suffix so nginx forwards
        # the full request path (/api/...) instead of collapsing to /api/.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
