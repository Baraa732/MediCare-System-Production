# Local development only — NEVER deploy this file to staging or production.
# Auto-loaded by `docker compose` alongside docker-compose.yml when present.
#
# Publishes databases and observability UIs to localhost for DBeaver, Grafana, OpenEMR, etc.
# Production/staging MUST use explicit -f flags and must NOT ship this file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres-auth:
    ports: ["5433:5432"]
  postgres-user:
    ports: ["5434:5432"]
  postgres-system:
    ports: ["5435:5432"]
  postgres-clinic:
    ports: ["5436:5432"]
  postgres-scheduling:
    ports: ["5437:5432"]
  postgres-notification:
    ports: ["5438:5432"]
  postgres-reminder:
    ports: ["5439:5432"]
  postgres-evolution:
    ports: ["5441:5432"]
  postgres-appointment:
    ports: ["5440:5432"]
  postgres-emr:
    ports: ["5442:5432"]
  mariadb-openemr:
    ports: ["3308:3306"]
  mongodb:
    ports: ["27018:27017"]
  redis:
    ports: ["6380:6379"]

  openemr:
    ports:
      - "8081:80"
      - "8443:443"

  evolution-api:
    ports:
      - "8080:8080"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"

  loki:
    ports:
      - "3100:3100"

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  otel-collector:
    ports:
      - "4319:4317"
      - "4320:4318"

  system-manager-dashboard:
    ports:
      - "3002:80"

  clinic-admin-dashboard:
    ports:
      - "3003:80"
