  system-manager-service:
    build:
      context: .
      dockerfile: ./Backend/NodeJS/microservices/system-manager-service/Dockerfile
    container_name: system_manager_service
    env_file:
      - ./Backend/NodeJS/microservices/system-manager-service/.env
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka-1:9092
      KAFKA_RETRY_COUNT: 12
      KAFKA_CONNECTION_TIMEOUT: 15000
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      CLINIC_SERVICE_URL: http://clinic-service:3006
      EMR_SERVICE_URL: http://emr-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      API_GATEWAY_URL: http://api-gateway:3000
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      CLINIC_STATS_DATABASE_HOST: postgres-clinic
      CLINIC_STATS_DATABASE_PORT: 5432
      CLINIC_STATS_DATABASE_USER: ${POSTGRES_USER}
      CLINIC_STATS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CLINIC_STATS_DATABASE_NAME: clinic_db
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
      PLATFORM_LOGS_ENABLED: "true"
      DOCKER_SOCKET: /var/run/docker.sock
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_QUERY_URL: http://jaeger:16686
      OTEL_COLLECTOR_URL: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: system-manager-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
