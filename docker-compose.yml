    container_name: reminder_service
    env_file:
      - ./Backend/NodeJS/microservices/reminder-service/.env
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka-1:9092
      KAFKA_RETRY_COUNT: 12
      KAFKA_CONNECTION_TIMEOUT: 15000
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      USER_SERVICE_URL: http://user-service:3002
      CLINIC_SERVICE_URL: http://clinic-service:3006
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reminder-service
    expose:
      - "3010"
    depends_on:
      notification-service:
        condition: service_healthy
      postgres-reminder:
        condition: service_healthy
      kafka-1:
