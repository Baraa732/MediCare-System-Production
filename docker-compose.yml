      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── API Gateway Load Balancer (Nginx) ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./Backend/NodeJS
      dockerfile: api-gateway/Dockerfile
    container_name: api_gateway
    env_file:
      - ./Backend/NodeJS/api-gateway/.env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EMR_SERVICE_URL: http://emr-service:3004
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      system-manager-service:
        condition: service_healthy
      emr-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reminder-service:
        condition: service_healthy
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  # ── Observability (Prometheus + Grafana) ───────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./DevOps/Docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - clinic_network
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./DevOps/Docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./DevOps/Docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./DevOps/Docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - clinic_network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./DevOps/Docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - clinic_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.6
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./DevOps/Docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - clinic_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - clinic_network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./DevOps/Docker/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - jaeger
    ports:
      - "4319:4317"
      - "4320:4318"
    networks:
      - clinic_network
    restart: unless-stopped

  system-manager-dashboard:
    build:
      context: ./Frontend/React/system-manager-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
        VITE_GRAFANA_DASHBOARD_UID: medicare-platform
    container_name: system_manager_dashboard
    ports:
      - "3002:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

volumes:
  redis_data:
  postgres_auth_data:
  postgres_user_data:
  postgres_system_data:
  postgres_emr_data:
  postgres_clinic_data:
  postgres_appointment_data:
  postgres_scheduling_data:
  postgres_notification_data:
  postgres_reminder_data:
  postgres_evolution_data:
  mariadb_openemr_data:
  openemr_logs:
  openemr_sites:
  mongo_data:
  zookeeper_1_data:
  zookeeper_1_log:
  kafka_1_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  clinic_network:
    driver: bridge
