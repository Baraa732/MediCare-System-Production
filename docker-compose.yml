  # ── OpenEMR (EHR) ─────────────────────────────────────────────────────────────
  # Full OpenEMR stack: MariaDB + openemr/openemr (appointments, billing, records)
  # UI: http://localhost:8081  (default login from OE_USER / OE_PASS)

  mariadb-openemr:
    image: mariadb:11.8
    container_name: mariadb_openemr
    command: ['mariadbd', '--character-set-server=utf8mb4']
    environment:
      MYSQL_ROOT_PASSWORD: ${OPENEMR_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: openemr
      MYSQL_USER: ${OPENEMR_MYSQL_USER}
      MYSQL_PASSWORD: ${OPENEMR_MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mariadb_openemr_data:/var/lib/mysql
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  openemr:
    image: openemr/openemr:latest
    container_name: openemr
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - openemr_logs:/var/log
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mariadb-openemr
      MYSQL_ROOT_PASS: ${OPENEMR_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${OPENEMR_MYSQL_USER}
      MYSQL_PASS: ${OPENEMR_MYSQL_PASSWORD}
      MYSQL_DATABASE: openemr
      OE_USER: ${OPENEMR_ADMIN_USER}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD}
      OPENEMR_SETTING_rest_api: "1"
      OPENEMR_SETTING_rest_fhir_api: "1"
      OPENEMR_SETTING_rest_portal_api: "1"
      OPENEMR_SETTING_oauth_password_grant: "3"
      OPENEMR_SETTING_site_addr_oath: "https://openemr"
      OPENEMR_SETTING_oauth_app_manual_approval: "0"
    depends_on:
      mariadb-openemr:
        condition: service_healthy
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.5'
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--insecure", "--location", "--show-error", "--silent", "https://localhost/meta/health/readyz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s

  postgres-emr:
    image: postgres:15-alpine
    container_name: postgres_emr
    environment:
      POSTGRES_DB: emr_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    expose:
      - "5432"
    volumes:
      - postgres_emr_data:/var/lib/postgresql/data
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: evolution_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── WhatsApp API ─────────────────────────────────────────────────────────────

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    environment:
      SERVER_URL: "http://evolution-api:8080"
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: MediCare
      CONFIG_SESSION_PHONE_NAME: Chrome
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH: true
      QRCODE_LIMIT: 30
      WEBHOOK_GLOBAL_ENABLED: false
      WEBHOOK_GLOBAL_URL: ""
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-evolution:5432/evolution_db?schema=public
      DATABASE_SAVE_DATA_INSTANCE: true
      DATABASE_SAVE_DATA_MESSAGE: true
      DATABASE_SAVE_DATA_CONTACT: true
      DATABASE_SAVE_DATA_CHATS: true
      CACHE_REDIS_ENABLED: false
    volumes:
      - ./Integrations/WhatsApp/evolution-api/manager/index.html:/evolution/node_modules/evolution-manager/dist/index.html:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres-evolution:
        condition: service_healthy
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ── Kafka cluster — single broker for development ─────────────────────
  # This simplified setup is tuned for local dev and lower memory usage.
  # It removes cluster replication and uses a single broker with replicate-factor=1.

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888"
    expose:
      - "2181"
      - "2888"
      - "3888"
    volumes:
      - zookeeper_1_data:/var/lib/zookeeper/data
      - zookeeper_1_log:/var/lib/zookeeper/log
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_1
    depends_on:
      zookeeper-1:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_MESSAGE_MAX_BYTES: 1048576
      KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: 300000
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: 30000
    expose:
      - "9092"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    healthcheck:
      # Use advertised listener hostname — same path clients use (not localhost-only).
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  # ── Topic initialisation (one-shot) ───────────────────────────────────────────
  # Topic registry: Messaging/Kafka/kafka-config/topics/topics.config.ts
  # Shell script:   Messaging/Kafka/scripts/kafka-init.sh (regenerate: cd Messaging/Kafka/kafka-config && npm run generate:kafka-init-sh)
  # Microservices start only after kafka-init exits 0 (service_completed_successfully).
  # After "docker compose restart kafka-1" only, re-run: docker compose run --rm kafka-init

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_init
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka-1:9092
    volumes:
      - ./Messaging/Kafka/scripts/kafka-init.sh:/usr/local/bin/kafka-init.sh:ro
    networks:
      - clinic_network
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/kafka-init.sh"]
    labels:
      com.medicare.lifecycle: init
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  # ── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: ./Backend/NodeJS/microservices/auth-service/Dockerfile
    container_name: auth_service
    env_file:
      - ./Backend/NodeJS/microservices/auth-service/.env
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka-1:9092
      KAFKA_RETRY_COUNT: 12
      KAFKA_CONNECTION_TIMEOUT: 15000
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: auth-service
    expose:
      - "3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-system:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
