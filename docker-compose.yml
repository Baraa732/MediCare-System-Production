      USER_SERVICE_URL: http://user-service:3002
      CLINIC_SERVICE_URL: http://clinic-service:3006
      SCHEDULING_SERVICE_URL: http://scheduling-service:3008
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
