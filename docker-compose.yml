    expose:
      - "3007"
    depends_on:
      scheduling-service:
        condition: service_healthy
      postgres-appointment:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - clinic_network
    restart: unless-stopped
    deploy:
